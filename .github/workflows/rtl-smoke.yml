name: Python 脚本语法检查

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The "rtl-sim" job that used to live here compiled the frozen
  # legacy-prototype/ archive (4 files under legacy-prototype/, a closed set
  # with no include and no readmem). It was removed on 2026-09-15 together with
  # that archive, because it was a false-green: it reported PASS for 56 of the
  # 59 commits then on develop without ever reading a file under code/.
  #
  # NOTE: this workflow therefore does NOT yet build code/rtl. Replacing it with
  # a job that compiles code/rtl plus the code/tb testbenches is tracked as
  # follow-up work; iverilog alone is enough for that (L2), but Gowin
  # synthesis/PnR (L4/L5) cannot run on a GitHub runner at all.
  script-syntax:
    name: 文档生成脚本语法检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查准备目录下的 Python 脚本语法
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import sys

          root = pathlib.Path("prep/脚本")
          files = sorted(root.glob("*.py"))
          if not files:
              print("未找到 Python 脚本，检查路径是否变更")
              sys.exit(1)
          failed = []
          for path in files:
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  failed.append(f"{path}:{exc.lineno}: {exc.msg}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print(f"语法检查通过，共 {len(files)} 个文件")
          PY
